name: Apply alpha-beta transfer patches

on:
  push:
    branches:
      - codex/add-alpha-beta-and-targeted-opening-mode

permissions:
  contents: write

jobs:
  apply-patches:
    if: github.event.head_commit.message != 'Remove transfer workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/add-alpha-beta-and-targeted-opening-mode

      - name: Apply verified patch series
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo '[... ELLIPSIZATION ...]' | base64 -d > /tmp/alpha-beta-patches.zip
          unzip -q /tmp/alpha-beta-patches.zip -d /tmp/alpha-beta-patches
          git am /tmp/alpha-beta-patches/0001-Add-alpha-beta-search-and-targeted-opening-tests.patch /tmp/alpha-beta-patches/0002-Fix-alpha-beta-build-and-benchmark-validation.patch
          rm .github/workflows/apply-alpha-beta-transfer.yml
          git add -A
          git commit -m "Remove transfer workflow"
          git push origin HEAD:codex/add-alpha-beta-and-targeted-opening-mode
