name: Deploy Sanctuary Simulator UI

on:
  push:
    paths:
      - "simulator-ui/**"
      - "simulator/**"
      - "src/game/**"
      - ".github/workflows/deploy-simulator-ui.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-simulator-ui"
  cancel-in-progress: false

jobs:
  build:
    name: Build simulator UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun for simulator UI tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install simulator UI dependencies
        working-directory: simulator-ui
        run: bun install

      - name: Run simulator UI tests
        working-directory: simulator-ui
        run: bun test tests

      - name: Build simulator UI
        working-directory: simulator-ui
        run: bun run build

      - name: Confirm Pages artifact entry point
        run: test -f simulator-ui/dist/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: simulator-ui/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
